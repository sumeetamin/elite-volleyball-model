[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-volleyball-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "pyarrow>=16"]

[project.optional-dependencies]
trees = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2"]
dev = ["pytest>=8.2"]

[project.scripts]
volley-model = "volleyball_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
