name: Model quality
on: [push, pull_request]
jobs:
  import-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: volley-model simulate --p-so-a 0.66 --p-so-b 0.64
